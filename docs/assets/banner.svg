<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E12"/>
      <stop offset="60%" stop-color="#16151D"/>
      <stop offset="100%" stop-color="#1D1B26"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D93D2E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D93D2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(245,242,235,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Border outline (Atelier paper frame) -->
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="rgba(245,242,235,0.12)" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="rgba(217,61,46,0.25)" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Atelier Seal top-right -->
  <g transform="translate(1030, 68)">
    <rect x="0" y="0" width="86" height="86" fill="none" stroke="#D93D2E" stroke-width="2" transform="rotate(3 43 43)"/>
    <rect x="4" y="4" width="78" height="78" fill="rgba(217,61,46,0.08)" transform="rotate(3 43 43)"/>
    <text x="43" y="44" font-family="sans-serif" font-size="28" font-weight="bold" fill="#D93D2E" text-anchor="middle" dominant-baseline="central">匠</text>
    <text x="43" y="68" font-family="monospace" font-size="10" font-weight="bold" fill="#D93D2E" letter-spacing="2" text-anchor="middle">ATELIER</text>
  </g>

  <!-- Network Motif in background right -->
  <g stroke="rgba(201,168,106,0.25)" stroke-width="1.5">
    <line x1="780" y1="260" x2="920" y2="210"/>
    <line x1="920" y1="210" x2="1060" y2="280"/>
    <line x1="920" y1="210" x2="890" y2="380"/>
    <line x1="890" y1="380" x2="1040" y2="430"/>
    <line x1="780" y1="260" x2="890" y2="380"/>
    <line x1="1060" y1="280" x2="1040" y2="430"/>
  </g>
  <g fill="#D93D2E">
    <circle cx="780" cy="260" r="6" fill="#E84E3F"/>
    <circle cx="920" cy="210" r="8" fill="#F5F2EB" stroke="#D93D2E" stroke-width="3"/>
    <circle cx="1060" cy="280" r="6" fill="#C9A86A"/>
    <circle cx="890" cy="380" r="7" fill="#818CF8"/>
    <circle cx="1040" cy="430" r="6" fill="#E84E3F"/>
  </g>

  <!-- Kicker -->
  <text x="72" y="110" font-family="monospace" font-size="14" font-weight="600" fill="#D93D2E" letter-spacing="3">// BACKEND &amp; DISTRIBUTED SYSTEMS</text>

  <!-- Main Name -->
  <text x="70" y="185" font-family="serif" font-size="62" font-weight="800" fill="#F5F2EB" letter-spacing="-1">Bhanu Teja Komma</text>

  <!-- Vermillion brush underline -->
  <rect x="72" y="208" width="380" height="4" rx="2" fill="#D93D2E"/>

  <!-- Subtitle -->
  <text x="72" y="260" font-family="sans-serif" font-size="24" font-weight="500" fill="#ECE7DC">
    Cloud-Native Architecture · Event-Driven Backend Systems
  </text>

  <!-- Key Highlight Badge / Card -->
  <g transform="translate(72, 300)">
    <rect x="0" y="0" width="640" height="155" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(245,242,235,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="155" fill="#D93D2E"/>
    
    <text x="24" y="36" font-family="serif" font-size="18" font-weight="700" fill="#F5F2EB">PRAJNA Platform — Approval &amp; Scoring Engine</text>
    <text x="24" y="66" font-family="sans-serif" font-size="15" fill="#9E98A8">Leads Business Logic Layer (BLL) · 30 Modules · 24 Developers · 3 Campuses</text>
    
    <text x="24" y="104" font-family="monospace" font-size="13" fill="#C9A86A">AWS Lambda · DynamoDB (Single-Table) · EventBridge · CDK · TypeScript</text>
    <text x="24" y="132" font-family="monospace" font-size="13" fill="#818CF8">Go · PostgreSQL · Distributed Transactions · Outbox Pattern · Redis</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(72, 520)">
    <text x="0" y="20" font-family="monospace" font-size="15" font-weight="600" fill="#F5F2EB">maczeo.me</text>
    <text x="160" y="20" font-family="monospace" font-size="14" fill="#6B6575">|</text>
    <text x="190" y="20" font-family="monospace" font-size="14" fill="#9E98A8">github.com/maczeo11</text>
    <text x="420" y="20" font-family="monospace" font-size="14" fill="#6B6575">|</text>
    <text x="450" y="20" font-family="monospace" font-size="14" fill="#9E98A8">linkedin.com/in/bhanu-teja-komma-4b5547293</text>
  </g>

  <!-- Status pill bottom right -->
  <g transform="translate(880, 508)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="rgba(217,61,46,0.12)" stroke="#D93D2E" stroke-width="1.2"/>
    <circle cx="24" cy="19" r="5" fill="#22C55E"/>
    <text x="40" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#F5F2EB">Available for Roles</text>
