<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <!-- paper base with subtle border -->
  <rect width="64" height="64" rx="12" fill="#0F0E12"/>
  <!-- vermillion seal border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="9" fill="none" stroke="#D93D2E" stroke-width="2.2"/>
  <!-- inner paper chip -->
  <rect x="9" y="9" width="46" height="46" rx="7" fill="#FDFBF7" opacity="0.04"/>
  <!-- 匠 mark -->
  <text x="32" y="42.5" text-anchor="middle" font-family="serif" font-weight="800" font-size="32" fill="#FDFBF7" letter-spacing="-0.5">匠</text>
  <!-- ink splatter dot -->
  <circle cx="48.5" cy="48.5" r="3.2" fill="#D93D2E"/>
  <circle cx="45.5" cy="51.5" r="1.2" fill="#D93D2E" opacity="0.7"/>
</svg>
