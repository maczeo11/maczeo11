<svg width="1200" height="36" viewBox="0 0 1200 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6e40c9"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="80%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="travelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a371f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="17" width="1200" height="2" fill="url(#dividerLine)"/>
  <!-- Dot 1: travels left to right, fades in/out at edges -->
  <circle cy="18" r="8" fill="url(#travelGlow)">
    <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- Dot 2: offset by 2.5s for continuous feel -->
  <circle cy="18" r="8" fill="url(#travelGlow)">
    <animate attributeName="cx" values="0;1200" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
  </circle>
</svg>