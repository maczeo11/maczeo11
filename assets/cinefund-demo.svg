<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="titleBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#1f1147"/>
    </linearGradient>
  </defs>

  <!-- Window background -->
  <rect width="760" height="380" rx="10" fill="url(#termBg)"/>
  <rect x="1" y="1" width="758" height="378" rx="9" fill="none" stroke="#2a2d3e" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="760" height="38" rx="10" fill="url(#titleBarBg)"/>
  <rect x="1" y="1" width="758" height="36" rx="9" fill="none" stroke="#2a2d3e" stroke-width="1.5"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="19" r="6" fill="#28ca42"/>

  <!-- Title text -->
  <text x="740" y="24" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" fill="#8b90a8">
    cinefund/internal/pledge  •  go test (50x concurrent)
  </text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI Mono', monospace" font-size="12.5" fill="#c9d1d9">
    <!-- Line 1: Command prompt -->
    <g id="cmd" opacity="0">
      <text x="24" y="70"><tspan fill="#a371f7">$</tspan><tspan fill="#8b90a8"> </tspan>go test ./internal/pledge -run TestHandleWebhook_SameEvent50xConcurrent -v</text>
    </g>

    <!-- Line 2: Run test header -->
    <g id="run" opacity="0" fill="#8b90a8">
      <text x="24" y="98">=== RUN   TestHandleWebhook_SameEvent50xConcurrent</text>
    </g>

    <!-- Line 3: Sending 50 concurrent webhooks -->
    <g id="step1" opacity="0" fill="#8b90a8">
      <text x="36" y="126">dispatching 50 concurrent identical webhooks (idem:wh:evt_89f02b)...</text>
    </g>

    <!-- Line 4: 1 Inserted -->
    <g id="step2" opacity="0">
      <text x="36" y="154"><tspan fill="#2ea043">✓</tspan> <tspan fill="#f0f3fa">[tx 1]</tspan> SETNX lock acquired → 200 OK (pledge recorded &amp; outbox event created)</text>
    </g>

    <!-- Line 5: 49 Rejected -->
    <g id="step3" opacity="0">
      <text x="36" y="182"><tspan fill="#2ea043">✓</tspan> <tspan fill="#f0f3fa">[tx 2..50]</tspan> SETNX rejected / UNIQUE key constraint → 409 Conflict (<tspan fill="#ff7b72">ErrDuplicateEvent</tspan>)</text>
    </g>

    <!-- Line 6: Ledger verified -->
    <g id="step4" opacity="0">
      <text x="36" y="210"><tspan fill="#2ea043">✓</tspan> <tspan fill="#f0f3fa">[ledger]</tspan> double-entry balance unchanged: <tspan fill="#e3b341">$0.00 → $0.00</tspan> (0 double-charges)</text>
    </g>

    <!-- Line 7: Pass line -->
    <g id="step5" opacity="0" fill="#2ea043">
      <text x="24" y="244">--- PASS: TestHandleWebhook_SameEvent50xConcurrent (0.00s)</text>
    </g>

    <!-- Line 8: PASS & OK summary -->
    <g id="step6" opacity="0">
      <text x="24" y="272" fill="#2ea043" font-weight="bold">PASS</text>
      <text x="24" y="300" fill="#8b90a8">ok      github.com/maczeo11/cinefund/internal/pledge    <tspan fill="#a371f7">0.342s</tspan></text>
    </g>
  </g>

  <!-- Blinking cursor -->
  <rect id="termCursor" x="24" y="320" width="8" height="15" fill="#a371f7" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" begin="4.2s"/>
  </rect>

  <!-- SMIL Animations for sequential reveal -->
  <animate xlink:href="#cmd" attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.2s" fill="freeze"/>
  <animate xlink:href="#run" attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.8s" fill="freeze"/>
  <animate xlink:href="#step1" attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.4s" fill="freeze"/>
  <animate xlink:href="#step2" attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.0s" fill="freeze"/>
  <animate xlink:href="#step3" attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.6s" fill="freeze"/>
  <animate xlink:href="#step4" attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.1s" fill="freeze"/>
  <animate xlink:href="#step5" attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.6s" fill="freeze"/>
  <animate xlink:href="#step6" attributeName="opacity" from="0" to="1" dur="0.15s" begin="4.0s" fill="freeze"/>
  <animate xlink:href="#termCursor" attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.2s" fill="freeze"/>
</svg>
